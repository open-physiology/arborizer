<div id="listContextMenu" class="context-menu" style="display:none">
    <ul id="ulAdd">
        {% for group in groups %}
            <li>
                <button>
                    >>{{ group.name }}
                </button>
            </li>
        {% endfor %}
    </ul>
</div>

<div id="vesselList" class="data_part w3-left sidePanel" style="display: none">
    <label for="vesselInput"></label>
    <input type="text" style="width:100%"
           id="vesselInput" class="Input" name="vesselInput" onkeyup="filterOptions()"/>
    <ul id="ulVessels">
        {% for node in vessels %}
            <li id="vesselOption{{ node.nodeID }}">
                {{ node.nodeID }}: ({{ node.fmaID }}) {{ node.name }}
            </li>
        {% endfor %}
    </ul>
</div>

<div id="includedList" class="data_part w3-left sidePanel" style="display: none">
    <label for="includedInput"></label>
    <div class="w3-border-bottom">
        <input type="checkbox" id=onlyIncluded" name="onlyIncluded" onchange="toggleIncluded(this)"/> <label for=onlyIncluded"></label>Included
    </div>
    <input type="text" style="width:100%"
           id="includedInput" class="Input" name="includedInput" onkeyup="filterIncludeOptions()"/>
    <ul id="ulIncluded">
        {% for node in includedOptions %}
            <li id="includeOption{{ node.fmaID }}">
                <label>
                    <input type="checkbox" value="{{ node.fmaID }}" {{ 'checked' if node.included == 1 else '' }} name="includedCheckbox"
                           onchange="toggleIncludeOption({{ node }})">
                </label>
                {{ node.fmaID }}: {{ node.name }}
            </li>
        {% endfor %}
    </ul>
</div>
