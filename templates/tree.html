<script src="//d3js.org/d3.v3.min.js"></script>
<div id="contextMenu" class="context-menu" style="display:none">
    <ul>
        <button onclick="moveUp()" class="menu-">Move up</button>
        <br/>
        <button onclick="moveDown()">Move down</button>
    </ul>
</div>

<script>
    treeDiagram({{ data|safe }})

    function treeDiagram(root) {
        let margin = {top: 20, right: 40, bottom: 20, left: 40},
            width = 4000 - margin.right - margin.left,
            height = 2000 - margin.top - margin.bottom;

        let i = 0, duration = 750;

        let tree = d3.layout.tree()
            .size([width, height]);

        let diagonal = d3.svg.diagonal()
            .projection(function (d) {
                return [d.x, d.y];
            });

        let svg = d3.select("#tree").append("svg")
            .attr("width", width + margin.right + margin.left)
            .attr("height", height + margin.top + margin.bottom)
            .append("g")
            .attr("transform", "translate(" + margin.left + "," + margin.top + ")");

        let tooltip = d3.select("body").append("div")
        .attr('id', 'tooltip').attr('class', 'tooltip')
        .style("visibility", "hidden");

        let contextMenu = document.getElementById("contextMenu");

        root.x0 = 0;
        root.y0 = width / 2;

        update(root);

        function update(source) {

            // Compute the new tree layout.
            let nodes = tree.nodes(root).reverse(),
                links = tree.links(nodes);

            // Normalize for fixed-depth.
            nodes.forEach(function (d) {
                d.y = d.depth * 30;
            });

            // Update the nodes…
            let node = svg.selectAll("g.node")
                .data(nodes, function (d) {
                    return d.id || (d.id = ++i);
                });

            // Enter any new nodes at the parent's previous position.
            let nodeEnter = node.enter().append("g")
                .attr("class", "node")
                .attr("transform", function (d) {
                    return "translate(" + source.x0 + "," + source.y0 + ")";
                })

            nodeEnter.append("circle")
                .attr("r", 1e-6)
                .style("fill", function (d) {
                    return d.data?.color || "lightsteelblue";
                })
              .on("mouseover", function(d){
                  tooltip.text(d.name);
                  return tooltip.style("visibility", "visible");})
              .on("mousemove", function(){return tooltip.style("top", (d3.event.pageY-10)+"px").style("left",(d3.event.pageX+10)+"px");})
              .on("mouseout", function(){return tooltip.style("visibility", "hidden");})
              .on('contextmenu', d => onRightClick(d));

            function hideMenu() {
                contextMenu.style.display = "none"
            }

            function onRightClick(nodeID) {
                console.log(nodeID);
                d3.event.preventDefault();
                console.log(contextMenu);
                if (contextMenu.style.display == "block")
                    hideMenu();
                else {
                    contextMenu.style.display = 'block';
                    contextMenu.style.left = d3.event.clientX + 'px';
                    contextMenu.style.top = d3.event.clientY + 'px';
                }
            }

            nodeEnter.append("text")
                .attr("x", function (d) {
                    return d.children || d._children ? 10 : -10;
                })
                .attr("dy", ".35em")
                .attr("text-anchor", function (d,i) {
                    return d.children || d._children ? "start" : "end";
                })
                .text(function (d) {
                    if (!d.data.connector){
                       return d.name.substring(0, 20);
                    }
                    return d.id;
                })
                .style("fill-opacity", 1e-6);

            // Transition nodes to their new position.
            var nodeUpdate = node.transition()
                .duration(duration)
                .attr("transform", function (d) {
                    return "translate(" + d.x + "," + d.y + ")";
                });

            nodeUpdate.select("circle")
                .attr("r", 4.5)
                .style("fill", function (d) {
                    return d.data?.color || "lightsteelblue";
                });

            nodeUpdate.select("text")
                .style("fill-opacity", 1);

            // Transition exiting nodes to the parent's new position.
            var nodeExit = node.exit().transition()
                .duration(duration)
                .attr("transform", function (d) {
                    return "translate(" + source.x + "," + source.y + ")";
                })
                .remove();

            nodeExit.select("circle")
                .attr("r", 1e-6);

            nodeExit.select("text")
                .style("fill-opacity", 1e-6);

            // Update the links…
            var link = svg.selectAll("path.link")
                .data(links, function (d) {
                    return d.target.id;
                });

            // Enter any new links at the parent's previous position.
            link.enter().insert("path", "g")
                .attr("class", "link")
                .attr("d", function (d) {
                    var o = {x: source.x0, y: source.y0};
                    return diagonal({source: o, target: o});
                })
                .on("mouseover", function(d){
                  tooltip.text(d.target.data?.conveyingLyph + " (" + d.target.data?.ontologyTerms + ")");
                  return tooltip.style("visibility", "visible");})
                .on("mousemove", function(){return tooltip.style("top", (d3.event.pageY-10)+"px").style("left",(d3.event.pageX+10)+"px");})
                .on("mouseout", function(){return tooltip.style("visibility", "hidden");});


            // Transition links to their new position.
            link.transition()
                .duration(duration)
                .attr("d", diagonal)
                .style("stroke", function (d) {
                    return d.target.data?.color || "#ccc";
                });

            // Transition exiting nodes to the parent's new position.
            link.exit().transition()
                .duration(duration)
                .attr("d", function (d) {
                    var o = {x: source.x, y: source.y};
                    return diagonal({source: o, target: o});
                })
                .remove();

            // Stash the old positions for transition.
            nodes.forEach(function (d) {
                d.x0 = d.x;
                d.y0 = d.y;
            });
        }

        function moveUp(e){
            console.log(e);
        }

        function moveDown(e){
            console.log(e);
        }
    }
</script>
