<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Arborizer</title>
    <meta charset="utf-8">
    <meta name="author" content="Natallia Kokash">
    <meta name="viewport" content="width=device-width, initial-scale=1.0,maximum-scale=1,user-scalable=no">
    <link rel="stylesheet" href="static/style.css">
</head>
<body>

<div class="data_caption">
    <form action="{{ url_for('path') }}" method="post">
        <label for="sourceInput"></label>
        <input type="text" placeholder="Select source node..." style="width:90%"
               id="sourceInput" class="Input" name="sourceInput"
               onkeyup="filterOptions('sourceInput', 'sourceDropdown')" onfocus="showDropdown('sourceDropdown')">
        <div class="dropdown" style="width:90%">
           <div id="sourceDropdown" class="dropdown-content">
            {% for o in fma_list %}
                <a id="{{ o.fmaID }}" onclick="selectSourceOption({{o.fmaID}})">{{ o.fmaID }}: {{ o.name }}</a>
            {% endfor %}
          </div>
        </div>

        <br><br>

        <label for="targetInput"></label>
        <input type="text" placeholder="Select target node..." style="width:90%"
               id="targetInput" class="Input" name="targetInput"
               onkeyup="filterOptions('targetInput', 'targetDropdown')" onfocus="showDropdown('targetDropdown')">
        <div class="dropdown" style="width:90%">
           <div id="targetDropdown" class="dropdown-content">
            {% for o in fma_list %}
                <a id="{{ o.fmaID }}" onclick="selectTargetOption({{o.fmaID}})">{{ o.fmaID }}: {{ o.name }}</a>
            {% endfor %}
          </div>
        </div>

        <button type="submit" class="pred-btn"> Find path </button>
    </form>

    <script>
        const fmaList = {{ fma_list | tojson }};
        const source = {{ source | tojson }};
        const target = {{ target | tojson }};

        function selectSourceOption(fmaID){
            let option = fmaList.find(e => e.fmaID === fmaID.toString());
            if (option){
                let source = document.getElementById("sourceInput");
                source.value = fmaID + ": " + option.name;
                hideDropdown('sourceDropdown');
            }
        }

        function selectTargetOption(fmaID){
            let option = fmaList.find(e => e.fmaID === fmaID.toString());
            if (option){
                let target = document.getElementById("targetInput");
                target.value = fmaID + ": " + option.name;
                hideDropdown('targetDropdown');
            }
        }

        function showDropdown(dropdownName) {
          document.getElementById(dropdownName).classList.add("show");
        }

        function hideDropdown(dropdownName){
          document.getElementById(dropdownName).classList.remove("show");
        }

        function toggleOptions(dropdownName, filter){
            let a = document.getElementById(dropdownName).getElementsByTagName("a");
            for (let i = 0; i < a.length; i++) {
                let txtValue = a[i].textContent || a[i].innerText;
                if (txtValue.toUpperCase().indexOf(filter) > -1) {
                    a[i].style.display = "";
                } else {
                    a[i].style.display = "none";
                }
            }
        }

        function filterOptions(inputName, dropdownName) {
            let input = document.getElementById(inputName);
            let filter = input.value.toUpperCase();
            toggleOptions(dropdownName, filter);
        }

        if (source && target) {
            selectSourceOption(source);
            selectTargetOption(target);
        }

    </script>
</div>

<div class="data_part" id="tree">
</div>

<div class="data_part">
    <h3>{{ caption }}</h3>
    {% for node in path %}
        {{ node }} <br/>
    {% endfor %}
</div>

{% include 'tree.html' %}


</body>
</html>
