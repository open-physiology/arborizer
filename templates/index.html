<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Arborizer</title>
    <meta charset="utf-8">
    <meta name="author" content="Natallia Kokash">
    <meta name="viewport" content="width=device-width, initial-scale=1.0,maximum-scale=1,user-scalable=no">
    <link rel="stylesheet" href="static/style.css">
    <link rel="stylesheet" href="static/w3.css">
</head>
<body>
    <div id="mainMenu" class="w3-sidebar w3-bar-block toolbar">
       <div class="w3-border">
            <button id="btnBackup" class="w3-bar-item w3-hover-light-grey" title="Create backup" onclick=backup()>▤</button>
            <button id="btnRestore" class="w3-bar-item w3-hover-light-grey" title="Restore from backup" onclick=restore()>⮐</button>
       </div>
       <div class="w3-border">
           <button id="btnShow" class="w3-bar-item w3-hover-light-grey" title="Show vessels" onclick=openNav()>☰</button>
           <button id="btnHide" class="w3-bar-item w3-hover-light-grey" style="display: none" title="Hide vessels" onclick=closeNav()>×</button>
           <button id="btnShowInc" class="w3-bar-item w3-hover-light-grey" title="Show included" onclick=openNavInc()>☑</button>
           <button id="btnHideInc" class="w3-bar-item w3-hover-light-grey" style="display: none" title="Hide included" onclick=closeNavInc()>×</button>
           <button id="btnApply" class="w3-bar-item w3-hover-light-grey" title="Apply changes"
                   onclick=applyChanges()>✓<span id="isChange" style="display: none; color: red;">*</span>
           </button>
       </div>
    </div>

    {% include 'list.html' %}
    {% include 'tree.html' %}

    <script>
        let vesselPanel = document.getElementById("vesselList");
        let includedPanel = document.getElementById("includedList");
        let btnShow = document.getElementById("btnShow");
        let btnHide = document.getElementById("btnHide");
        let btnShowInc = document.getElementById("btnShowInc");
        let btnHideInc = document.getElementById("btnHideInc");
        let isChange = document.getElementById("isChange");
        let btnRestore = document.getElementById("btnRestore");
        let contextMenu = document.getElementById("listContextMenu");
        let tree = document.getElementById("tree");

        document.addEventListener("click", function(e){
            if (contextMenu.style.display === "block"){
                hideListMenu();
            }
        });

        let actions = [];
        let addSet = new Set();
        let removeSet = new Set();
        let treeDiagram;

        const includedOptions = {{ includedOptions | safe }};
        const vessels = {{ vessels | safe }};
        const groups = {{ groups | safe }};
        const data = {{ data | safe }};

        treeDiagram = new Tree(data, groups, actions);

        vessels.forEach(vessel => {
            let vesselOption = document.getElementById("vesselOption"+vessel.nodeID);
            if (vesselOption) {
                vesselOption.oncontextmenu = e => showMenu(e, vessel);
            }
        })

        function showMenu(e, node){
            e.preventDefault();
            contextMenu.style.display = 'block';
            contextMenu.style.left = e.pageX+'px';
            contextMenu.style.top = e.pageY+'px';
            let groupList  = Object.values(groups);
            if (groupList.length > 0){
                let ul = document.getElementById('ulAdd');
                ul.innerHTML = '';
                function renderGroupMenu(group) {
                    let li = document.createElement('li');
                    ul.appendChild(li);
                    let btn = document.createElement('button');
                    btn.onclick = e => addToGroup(node, group);
                    btn.innerHTML = ">>" + group.name;
                    li.appendChild(btn);
                }
                groupList.forEach(renderGroupMenu);
            }
        }

        function filterOptions() {
            let input, filter, ul, li, btn, i, txtValue;
            input = document.getElementById("vesselInput");
            filter = input.value.toUpperCase();
            ul = document.getElementById("ulVessels");
            li = ul.getElementsByTagName("li");
            for (i = 0; i < li.length; i++) {
                txtValue = li[i].innerHTML;
                if (txtValue.toUpperCase().indexOf(filter) > -1) {
                    li[i].style.display = "";
                } else {
                    li[i].style.display = "none";
                }
            }
        }

        function filterIncludeOptions() {
            let input, filter, ul, li, btn, i, txtValue;
            input = document.getElementById("includedInput");
            filter = input.value.toUpperCase();
            ul = document.getElementById("ulIncluded");
            li = ul.getElementsByTagName("li");
            for (i = 0; i < li.length; i++) {
                txtValue = li[i].innerHTML;
                if (txtValue.toUpperCase().indexOf(filter) > -1) {
                    li[i].style.display = "";
                } else {
                    li[i].style.display = "none";
                }
            }
        }

        function hideListMenu() {
            contextMenu.style.display = "none"
        }

        function addToGroup(node, group){
            hideListMenu();
            let res = treeDiagram.addToGroup(node, group);
            if (res){
                //Disable added
                let vesselOption = document.getElementById("vesselOption"+node.nodeID);
                vesselOption.classList.add('disabled');
                vesselOption.removeAttribute("onclick");
            }
        }

        function saveAction(action, node) {
            actions.push({"action": action, "node": node});
        }

        function openNav() {
          vesselPanel.style.display = "block";
          tree.style.marginLeft = "650px";
          btnHide.style.display = "block";
          btnShow.style.display = "none";
          btnShowInc.style.display = "none";
        }

        function closeNav() {
          vesselPanel.style.display = "none";
          tree.style.marginLeft = "50px";
          btnHide.style.display = "none";
          btnShow.style.display = "block";
          btnShowInc.style.display = "block";
        }

        function openNavInc() {
          includedPanel.style.display = "block";
          tree.style.marginLeft = "650px";
          btnHideInc.style.display = "block";
          btnShowInc.style.display = "none";
          btnShow.style.display = "none";
        }

        function closeNavInc() {
          includedPanel.style.display = "none";
          tree.style.marginLeft = "50px";
          btnHideInc.style.display = "none";
          btnShowInc.style.display = "block";
          btnShow.style.display = "block";
        }

        function toggleIncludeOption(node){
            node.included = node.included? 0: 1;
            if (node.included){
                addSet.add(node.fmaID);
                removeSet.delete(node.fmaID);
            } else {
                addSet.delete(node.fmaID);
                removeSet.add(node.fmaID);
            }
            isChange.style.display = 'inline';
        }

        async function backup(){
            await fetch("/backup");
        }

        async function restore(){
            await fetch("/restore");
        }

        async function applyChanges(){
            let request ="/edit?actions="+JSON.stringify(actions);
            request += '&include=' + JSON.stringify([...addSet]);
            request += '&exclude=' + JSON.stringify([...removeSet]);
            await fetch(request);
            isChange.style.display = 'none';
        }
    </script>

</body>
</html>
